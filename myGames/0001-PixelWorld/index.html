  <script>
    (() => {
      const DEFAULT_ROOM = 'public-survival';
      const DEFAULT_NAME = '豬大探索者';
      const DEFAULT_MAP = 'piggy-base';

      const searchParams = new URLSearchParams(window.location.search);
      if (!searchParams.get('room')) {
        searchParams.set('room', DEFAULT_ROOM);
      }
      if (!searchParams.get('name')) {
        searchParams.set('name', DEFAULT_NAME);
      }
      if (!searchParams.get('map')) {
        searchParams.set('map', DEFAULT_MAP);
      }
      if (!searchParams.get('language')) {
        searchParams.set('language', 'tw');
      }
      const resolved = {
        roomId: searchParams.get('room')?.trim() || DEFAULT_ROOM,
        name: searchParams.get('name')?.trim() || DEFAULT_NAME,
        mapId: searchParams.get('map')?.trim() || DEFAULT_MAP,
      };
      const urlSuffix = searchParams.toString();
      const nextLocation = `${window.location.pathname}?${urlSuffix}`;
      if (window.location.href !== new URL(nextLocation, window.location.href).toString()) {
        window.history.replaceState({}, '', nextLocation);
      }

      const roomJoinResponse = {
        ok: true,
        room: {
          phase: 'open',
          availableSlots: 64,
          mapId: resolved.mapId,
        },
      };

      const originalXMLHttpRequest = window.XMLHttpRequest;
      class MockXMLHttpRequest {
        constructor() {
          this.readyState = 0;
          this.status = 0;
          this.responseText = '';
          this.onload = null;
          this.onerror = null;
          this.onreadystatechange = null;
          this._async = true;
          this._method = 'GET';
          this._url = '';
          this._headers = {};
        }

        open(method, url, async = true) {
          this._method = (method || '').toUpperCase();
          this._url = String(url);
          this._async = async !== false;
          this.readyState = 1;
        }

        setRequestHeader(key, value) {
          this._headers[key] = String(value);
        }

        send(body) {
          const payload = JSON.stringify(roomJoinResponse);
          const normalizedUrl = (() => {
            try {
              if (this._url.startsWith('/')) {
                return this._url;
              }
              return new URL(this._url, window.location.href).pathname;
            } catch {
              return this._url;
            }
          })();
          const sendNow = () => {
            this.readyState = 4;
            const isRoomRequest = this._method === 'GET'
              && normalizedUrl.startsWith('/api/rooms/')
              && normalizedUrl.split('/').length >= 4;

            if (isRoomRequest) {
              this.status = 200;
              this.responseText = payload;
            } else {
              this.status = 404;
              this.responseText = JSON.stringify({ ok: false, message: 'mock endpoint' });
            }

            if (typeof this.onreadystatechange === 'function') {
              this.onreadystatechange();
            }
            if (this.status >= 200 && this.status < 300 && typeof this.onload === 'function') {
              this.onload({ target: this });
            }
          };

          if (this._async) {
            setTimeout(sendNow, 0);
          } else {
            sendNow();
          }

          return body;
        }
      }

      const decodeServerPayload = (raw) => {
        if (typeof raw === 'string') {
          try {
            return JSON.parse(raw);
          } catch {
            return null;
          }
        }
        try {
          return {
            v: 1,
            payload: raw instanceof Blob
              ? JSON.parse(raw)
              : {
                  type: 'unknown',
                },
          };
        } catch {
          return null;
        }
      };

      const wrapPayload = (message) => ({
        v: 1,
        payload: message,
      });

      const nowMs = () => Date.now();
      const clamp = (value, fallback = 0) => (Number.isFinite(value) ? value : fallback);
      const basePlayer = {
        position: { x: 0.5, y: 7.02, z: 0.5 },
        velocity: { x: 0, y: 0, z: 0 },
      };

      const toWelcomeMessage = () => {
        const now = nowMs();
        const playerId = `p-${Math.abs(resolved.name.split('').reduce((sum, char) => sum + char.charCodeAt(0) * 31, 0)).toString(16)}`;
        const nowPlayer = {
          id: playerId,
          name: resolved.name,
          position: { ...basePlayer.position },
          velocity: { ...basePlayer.velocity },
          yaw: 0,
          pitch: 0,
          moveSpeed: 1,
          attackPulse: 0,
          health: 20,
          maxHealth: 20,
          cameraMode: 'first-person',
          selectedSlot: 0,
          deathCount: 0,
          avatarStyleId: 'zhuda',
          equipmentVisuals: {
            weaponEquipmentId: null,
            toolEquipmentId: null,
            headEquipmentId: null,
            bodyEquipmentId: null,
            accessoryEquipmentId: null,
          },
          isDowned: false,
          downedUntilMs: null,
          isSleeping: false,
          sleepingBedCell: null,
        };

        return wrapPayload({
          type: 'welcome',
          playerId,
          players: [nowPlayer],
          blockStates: [],
          paintings: [],
          screens: [],
          propertyClaims: [],
          worldSnapshotChunkCount: 0,
          inventory: {
            dirt: 120,
            grass: 80,
            stone: 80,
            wood: 20,
            plank: 30,
            torch: 20,
            water_bucket: 1,
          },
          equipment: {
            pickaxeTier: 2,
            spearTier: 1,
            bagCapacity: 32,
            bag: [],
            equipped: {
              weaponEquipmentId: null,
              toolEquipmentId: null,
              headEquipmentId: null,
              bodyEquipmentId: null,
              accessoryEquipmentId: null,
            },
          },
          monsters: [
            {
              id: 'monster-orange-1',
              kind: 'orange-mushroom',
              position: { x: -16, y: 6, z: 4 },
              health: 24,
              maxHealth: 24,
              targetPlayerId: null,
              isTamed: false,
            },
          ],
          npcs: [
            {
              id: 'npc-guide',
              name: '村長',
              kind: 'guide',
              position: { x: 6.5, y: 7, z: 6.5 },
              color: '#8ec6ff',
              avatarStyleId: 'zhuer',
            },
          ],
          onlineCount: 1,
          roundState: {
            goalSeconds: 0,
            serverNowMs: now,
            roundStartedAtMs: now,
            hazardStartsAtMs: now,
            goalEndsAtMs: now + clamp(20 * 60 * 1000),
          },
          dayNightState: {
            cycleDurationMs: 240000,
            cycleStartedAtMs: now,
            serverNowMs: now,
          },
          teamState: {
            onlineCount: 1,
            roundPlayers: 1,
            alivePlayers: 1,
            flawless: true,
          },
          roomState: {
            id: resolved.roomId,
            title: '本地單機房',
            mapId: resolved.mapId,
            gameMode: 'survival',
            theme: 'zhuda-zhuer',
            maxPlayers: 16,
            allowPlayerDamage: false,
            onlineCount: 1,
            isPermanent: true,
            phase: 'open',
            activeUntilMs: null,
            closingAtMs: null,
            serverNowMs: now,
            joinPath: `/room.html?room=${encodeURIComponent(resolved.roomId)}`,
          },
          chatHistory: [
            {
              id: `welcome-${now}`,
              playerId: 'system',
              playerName: '系統',
              text: '歡迎進入單機版，這是從後端快照模擬進來的遊戲。',
              sentAtMs: now,
            },
          ],
          voiceParticipantIds: [],
          transportCapabilities: {
            protocolVersion: 1,
            sessionTransport: 'websocket-msgpack',
            gameplay: {
              reliableLane: 'websocket',
              lowLatencyLane: 'none',
              binaryEncoding: 'msgpack',
            },
            features: {
              realtimeChat: true,
              voiceSignaling: false,
              voiceMedia: false,
              gameplayDataChannel: false,
            },
          },
          piggyCoinBalanceCents: 2000,
          totalPlayTimeMs: 0,
        });
      };

      const toPlayerHeartbeat = (messageType, index) => {
        const now = nowMs();
        const nowPlayer = {
          id: `p-${Math.abs(resolved.name.split('').reduce((sum, char) => sum + char.charCodeAt(0) * 31, 0)).toString(16)}`,
          name: resolved.name,
          position: {
            x: clamp(basePlayer.position.x + 0.03 * index, 0.5),
            y: clamp(basePlayer.position.y, 7.02),
            z: clamp(basePlayer.position.z + 0.03 * index, 0.5),
          },
          velocity: { ...basePlayer.velocity },
          yaw: 0,
          pitch: 0,
          moveSpeed: 1,
          attackPulse: 0,
          health: 20,
          maxHealth: 20,
          cameraMode: 'first-person',
          selectedSlot: 0,
          deathCount: 0,
          avatarStyleId: 'zhuda',
          equipmentVisuals: {
            weaponEquipmentId: null,
            toolEquipmentId: null,
            headEquipmentId: null,
            bodyEquipmentId: null,
            accessoryEquipmentId: null,
          },
          isDowned: false,
          downedUntilMs: null,
          isSleeping: false,
          sleepingBedCell: null,
        };

        return {
          type: messageType,
          player: nowPlayer,
        };
      };

      class MockWebSocket {
        static CONNECTING = 0;
        static OPEN = 1;
        static CLOSING = 2;
        static CLOSED = 3;

        constructor(url) {
          this.url = url;
          this.readyState = MockWebSocket.CONNECTING;
          this.binaryType = 'arraybuffer';
          this.protocol = '';
          this.extensions = '';
          this.bufferedAmount = 0;
          this.onopen = null;
          this.onmessage = null;
          this.onerror = null;
          this.onclose = null;
          this._listeners = new Map();
          this._closed = false;
          this._closeReason = '';
          this._closeCode = 1000;
          this._heartbeatCounter = 0;

          queueMicrotask(() => {
            this.readyState = MockWebSocket.OPEN;
            this._fire('open', {});
            const welcome = toWelcomeMessage();
            this._fire('message', { data: JSON.stringify(welcome) });

            this._tick = window.setInterval(() => {
              if (this.readyState !== MockWebSocket.OPEN) {
                return;
              }
              this._heartbeatCounter += 1;
              if (this._heartbeatCounter === 4) {
                this._heartbeatCounter = 0;
                const payload = wrapPayload({
                  type: 'player_sync',
                  player: toPlayerHeartbeat('player_sync', this._heartbeatCounter).player,
                });
                this._fire('message', { data: JSON.stringify(payload) });
              }
            }, 1000);
          });
        }

        addEventListener(type, handler) {
          if (!this._listeners.has(type)) {
            this._listeners.set(type, new Set());
          }
          this._listeners.get(type).add(handler);
        }

        removeEventListener(type, handler) {
          this._listeners.get(type)?.delete(handler);
        }

        _fire(type, init = {}) {
          const event = { type, target: this, currentTarget: this, ...init };
          if (type === 'message' && this.readyState >= MockWebSocket.OPEN) {
            event.origin = this.url;
            event.data = init.data ?? event.data;
          }
          if (type === 'close') {
            event.code = this._closeCode;
            event.reason = this._closeReason;
            event.wasClean = true;
          }

          const handler = this[`on${type}`];
          if (typeof handler === 'function') {
            handler(event);
          }
          const handlers = this._listeners.get(type);
          if (!handlers) {
            return;
          }

          handlers.forEach((callback) => {
            if (typeof callback === 'function') {
              callback(event);
            }
          });
        }

        send(data) {
          // 本地端上報訊息目前不影響畫面，保留以避免前端邏輯拋錯。
          void decodeServerPayload(data);
          return data;
        }

        close(code = 1000, reason = '') {
          if (this.readyState === MockWebSocket.CLOSING || this.readyState === MockWebSocket.CLOSED) {
            return;
          }
          this.readyState = MockWebSocket.CLOSING;
          this._closeCode = code;
          this._closeReason = reason;
          if (this._tick) {
            clearInterval(this._tick);
          }
          this.readyState = MockWebSocket.CLOSED;
          this._fire('close', {});
        }
      }

      window.XMLHttpRequest = MockXMLHttpRequest;
      window.WebSocket = MockWebSocket;
    })();
  </script>
