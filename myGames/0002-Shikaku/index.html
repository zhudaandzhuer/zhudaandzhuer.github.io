<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
  <title>Shikaku 7×7｜數方塊</title>
  <meta name="description" content="7×7 數方塊（Shikaku）益智遊戲：把盤面切成矩形，讓每個數字等於所屬區塊的面積。" />
  <link rel="icon" type="image/png" sizes="256x256" href="./assets/shikaku-icon.png">
  <link rel="icon" type="image/png" href="./assets/shikaku-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/shikaku-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1ea;
      --card: #fffcf7;
      --cell-bg: #fffcf7;
      --ink: #1c1a17;
      --ink-2: #3d3832;
      --muted: #7a7368;
      --line: #e2d9cb;
      --grid-line: #d6ccbc;
      --accent: #cf4a1f;
      --accent-soft: #f9e3d8;
      --good: #2f8f6a;
      --bad: #c8434f;
      --shadow: 0 1px 2px rgba(40, 30, 20, .05), 0 18px 40px -20px rgba(40, 30, 20, .28);
      --serif: "Noto Serif TC", Georgia, "Songti TC", serif;
      --sans: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --gap: 2px;
      --block-radius: clamp(6px, 1.6vw, 9px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #111214;
        --card: #191b1e;
        --cell-bg: #1d1f23;
        --ink: #eeeae3;
        --ink-2: #cfc9bf;
        --muted: #958f85;
        --line: #2b2e33;
        --grid-line: #34373d;
        --accent: #ff7b4f;
        --accent-soft: #33201a;
        --good: #5cc79c;
        --bad: #ff7b86;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 40px -20px rgba(0, 0, 0, .7);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; justify-content: center; }
    button { border: 0; font: inherit; color: inherit; }

    .app {
      width: min(100%, 520px);
      min-height: 100dvh;
      padding: calc(14px + var(--safe-top)) 16px calc(18px + var(--safe-bottom));
      display: grid;
      grid-template-rows: auto auto auto minmax(0, auto) auto auto;
      align-content: start;
      gap: 14px;
      position: relative;
    }

    .crumb {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }
    .crumb a { color: inherit; text-decoration: none; transition: color .15s; }
    .crumb a:hover { color: var(--ink); }

    .topbar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 6px 0 2px;
    }

    .icon-btn {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--line);
      display: grid; place-items: center; cursor: pointer; color: var(--ink-2);
      transition: transform 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn:active, .action-btn:active, .primary-btn:active { transform: scale(0.96); }
    .icon-btn:hover, .action-btn:hover { border-color: var(--ink-2); color: var(--ink); }

    .header-copy { text-align: center; pointer-events: none; user-select: none; }
    .date-line {
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 4px; white-space: nowrap;
    }
    h1 {
      margin: 0; font-family: var(--serif); font-weight: 900;
      font-size: clamp(32px, 8.4vw, 44px); line-height: 1.05; letter-spacing: .01em;
    }
    h1 small { font-family: var(--mono); font-weight: 500; font-size: .38em; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
    .timer {
      margin-top: 6px; font-family: var(--mono); font-weight: 500;
      font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .06em;
    }

    .status-card {
      border-radius: 14px; background: var(--card); border: 1px solid var(--line);
      padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 50px;
    }
    .status-text { min-width: 0; color: var(--ink-2); font-size: 14px; line-height: 1.4; }
    .status-chip {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 10px; border-radius: 999px; background: var(--paper);
      color: var(--ink-2); font-family: var(--mono); font-size: 12px; font-weight: 600;
      font-variant-numeric: tabular-nums; border: 1px solid var(--line);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--good); }

    .board-shell {
      width: min(100%, 480px); margin: 0 auto;
      border-radius: 18px; padding: 12px;
      background: var(--card); border: 1px solid var(--line);
      box-shadow: var(--shadow);
      user-select: none;
    }
    .board {
      width: 100%; aspect-ratio: 1 / 1; position: relative;
      touch-action: none; isolation: isolate;
      background: var(--grid-line);
      border: var(--gap) solid var(--grid-line);
      border-radius: 6px;
    }
    .grid, .blocks { position: absolute; inset: 0; }
    .blocks { z-index: 1; pointer-events: none; }
    .grid {
      z-index: 2; display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));
      gap: var(--gap);
    }
    .cell {
      position: relative; min-width: 0; min-height: 0;
      background: var(--cell-bg);
      display: flex; align-items: center; justify-content: center;
      padding: 0; overflow: hidden; color: var(--ink);
      transition: background 90ms linear, color 140ms ease;
      cursor: crosshair;
    }
    .cell:nth-child(1) { border-top-left-radius: 4px; }
    .cell:nth-child(7) { border-top-right-radius: 4px; }
    .cell:nth-child(43) { border-bottom-left-radius: 4px; }
    .cell:nth-child(49) { border-bottom-right-radius: 4px; }
    .cell.filled, .cell.draft { background: transparent; }
    @media (hover: hover) {
      .cell:not(.filled):not(.draft):hover { background: var(--accent-soft); }
    }
    .cell .num {
      position: relative; z-index: 4; text-align: center; width: 100%; line-height: 1;
      font-family: var(--serif); font-weight: 900;
      font-size: clamp(20px, 6.6vw, 34px);
      font-variant-numeric: tabular-nums; pointer-events: none;
    }

    .block {
      position: absolute;
      border-radius: var(--block-radius);
      box-shadow: inset 0 0 0 3px var(--card), inset 0 -10px 18px rgba(0, 0, 0, .06);
      transform: translateZ(0);
      will-change: left, top, width, height;
      transition: left 70ms ease, top 70ms ease, width 70ms ease, height 70ms ease, opacity 120ms ease;
    }
    .block.draft {
      opacity: .78; z-index: 2;
      box-shadow: inset 0 0 0 3px var(--card), 0 0 0 2px var(--ink);
    }
    .block.invalid { background: var(--bad) !important; opacity: .7; }

    .selection-badge {
      position: absolute; z-index: 6; min-width: 52px; padding: 5px 10px; border-radius: 999px;
      background: var(--ink); color: var(--paper);
      font-family: var(--mono); font-size: 12.5px; font-weight: 600;
      font-variant-numeric: tabular-nums; text-align: center; pointer-events: none;
      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .4);
      transform: translate(-50%, -125%);
    }
    .selection-badge.good { background: var(--good); color: #fff; }
    .selection-badge.bad { background: var(--bad); color: #fff; }

    .board.shake { animation: shake 220ms ease both; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      22% { transform: translateX(-5px); }
      45% { transform: translateX(5px); }
      68% { transform: translateX(-3px); }
      86% { transform: translateX(2px); }
    }

    .actions {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
      width: min(100%, 480px); margin: 0 auto;
    }
    .action-btn {
      height: 46px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
      color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, opacity 140ms ease;
    }
    .action-btn#newBtn { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .action-btn[disabled] { opacity: .4; cursor: not-allowed; }
    .action-btn.answer-armed { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .progress-card {
      width: min(100%, 480px); margin: 0 auto; display: grid; gap: 8px; padding: 2px 2px 0;
    }
    .progress-bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .progress-fill {
      display: block; height: 100%; width: 0%; border-radius: inherit;
      background: var(--accent); transition: width 220ms ease;
    }
    .progress-row {
      display: flex; justify-content: space-between; gap: 12px; color: var(--muted);
      font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
    }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom));
      transform: translate(-50%, 18px); z-index: 30; max-width: min(92vw, 460px);
      padding: 11px 16px; border-radius: 999px; background: var(--ink); color: var(--paper);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .45);
      pointer-events: none; opacity: 0; transition: opacity 160ms ease, transform 160ms ease;
      font-weight: 700; font-size: 14px; text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .sheet {
      position: fixed; inset: 0; z-index: 25; display: grid; place-items: center;
      padding: 20px 16px calc(20px + var(--safe-bottom));
      background: color-mix(in srgb, var(--paper) 55%, transparent);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .sheet[hidden] { display: none; }
    .sheet-card {
      width: min(100%, 440px); border-radius: 20px; padding: 26px 24px 22px;
      background: var(--card); border: 1px solid var(--line);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .45);
    }
    .sheet-card h2 { margin: 0 0 8px; font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1.2; }
    .sheet-card p { margin: 8px 0; color: var(--ink-2); line-height: 1.65; font-size: 15px; }
    .rules { display: grid; gap: 10px; margin: 16px 0 22px; padding: 0; list-style: none; }
    .rules li {
      display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
      color: var(--ink-2); line-height: 1.55; font-size: 14.5px;
    }
    .rule-num {
      width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 12px;
    }
    .primary-btn {
      width: 100%; height: 50px; border-radius: 12px; background: var(--ink); color: var(--paper);
      font-weight: 700; font-size: 15px; cursor: pointer; transition: transform 140ms ease, opacity 140ms ease;
    }
    .primary-btn:hover { opacity: .9; }
    .win-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 20px; }
    .win-stat { border-radius: 14px; padding: 14px; background: var(--paper); border: 1px solid var(--line); }
    .win-stat strong { display: block; font-family: var(--mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .win-stat span { color: var(--muted); font-size: 13px; }

    @media (max-height: 740px) {
      .app { gap: 10px; }
      .date-line { display: none; }
      .status-card { padding: 9px 12px; min-height: 44px; }
      .action-btn { height: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; scroll-behavior: auto !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Shikaku 7×7 遊戲">
    <div class="crumb">
      <a href="../../index.html#works">← 趙敬瑋 · 作品集</a>
      <span>#0002</span>
    </div>

    <header class="topbar">
      <button class="icon-btn" id="newTopBtn" type="button" aria-label="開新局">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M20 4v6h-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="header-copy">
        <div class="date-line" id="dateLine">Wednesday, 18 March</div>
        <h1>Shikaku<small>7×7</small></h1>
        <div class="timer" id="timer">00:00</div>
      </div>

      <button class="icon-btn" id="helpBtn" type="button" aria-label="玩法說明">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9.7 9.15a2.55 2.55 0 0 1 5.02.56c0 2.34-2.72 2.15-2.72 4.32" stroke="currentColor" stroke-width="2.35" stroke-linecap="round"/>
          <path d="M12 18.25h.01" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2" opacity=".55"/>
        </svg>
      </button>
    </header>

    <section class="status-card" aria-live="polite">
      <div class="status-text" id="statusText">拖出一個矩形；裡面只能有一個數字，格數要等於它。</div>
      <div class="status-chip" id="puzzleChip"><span class="status-dot"></span><span>7×7</span></div>
    </section>

    <section class="board-shell">
      <div class="board" id="board" aria-label="7 乘 7 數讀盤">
        <div class="blocks" id="blocks" aria-hidden="true"></div>
        <div class="grid" id="grid" role="grid" aria-rowcount="7" aria-colcount="7"></div>
        <div class="selection-badge" id="selectionBadge" hidden>0</div>
      </div>
    </section>

    <nav class="actions" aria-label="遊戲操作">
      <button class="action-btn" id="newBtn" type="button">新局</button>
      <button class="action-btn" id="clearBtn" type="button">清空</button>
      <button class="action-btn" id="hintBtn" type="button">提示</button>
      <button class="action-btn" id="undoBtn" type="button" disabled>回復</button>
      <button class="action-btn" id="answerBtn" type="button">答案</button>
    </nav>

    <section class="progress-card" aria-label="完成進度">
      <div class="progress-bar"><span class="progress-fill" id="progressFill"></span></div>
      <div class="progress-row">
        <span id="filledText">已上色 0 / 49</span>
        <span id="bestText">最佳：—</span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="sheet" id="helpSheet" hidden aria-modal="true" role="dialog" aria-labelledby="helpTitle">
    <div class="sheet-card">
      <h2 id="helpTitle">玩法</h2>
      <p>每一個數字都是一塊矩形區域的面積。你的任務是把 7×7 全部上色。</p>
      <ul class="rules">
        <li><span class="rule-num">1</span><span>從任意一格按住拖曳，拉出矩形選區。</span></li>
        <li><span class="rule-num">2</span><span>矩形裡只能包含一個數字，而且格數必須等於那個數字。</span></li>
        <li><span class="rule-num">3</span><span>所有區塊不可重疊，最後 49 格都要被上色。</span></li>
      </ul>
      <button class="primary-btn" id="closeHelpBtn" type="button">開始玩</button>
    </div>
  </section>

  <section class="sheet" id="winSheet" hidden aria-modal="true" role="dialog" aria-labelledby="winTitle">
    <div class="sheet-card">
      <h2 id="winTitle">完成！</h2>
      <p>整個數讀盤都已正確上色。</p>
      <div class="win-stats">
        <div class="win-stat"><span>本局時間</span><strong id="winTime">00:00</strong></div>
        <div class="win-stat"><span>最佳時間</span><strong id="winBest">—</strong></div>
      </div>
      <button class="primary-btn" id="nextGameBtn" type="button">下一局</button>
    </div>
  </section>

  <script>
    (() => {
      "use strict";

      const SIZE = 7;
      const TOTAL = SIZE * SIZE;
      const MIN_AREA = 2;
      const DEFAULT_MAX_AREA = 12;
      const BEST_KEY = "shikaku-7x7-best-v1";
      const HELP_KEY = "shikaku-7x7-help-seen-v1";

      const palette = [
        "#d9643a", "#3f7f6e", "#e2a93b", "#4f6fa8", "#b5506e",
        "#7a9a4a", "#8a5fa6", "#2f9bb0", "#c98a5a", "#5d7f9c",
        "#d7836f", "#6c8f7b", "#9c6b4e", "#c4a24c"
      ];

      const els = {
        dateLine: document.getElementById("dateLine"),
        timer: document.getElementById("timer"),
        statusText: document.getElementById("statusText"),
        puzzleChip: document.getElementById("puzzleChip"),
        board: document.getElementById("board"),
        grid: document.getElementById("grid"),
        blocks: document.getElementById("blocks"),
        selectionBadge: document.getElementById("selectionBadge"),
        progressFill: document.getElementById("progressFill"),
        filledText: document.getElementById("filledText"),
        bestText: document.getElementById("bestText"),
        toast: document.getElementById("toast"),
        helpSheet: document.getElementById("helpSheet"),
        winSheet: document.getElementById("winSheet"),
        winTime: document.getElementById("winTime"),
        winBest: document.getElementById("winBest"),
        newTopBtn: document.getElementById("newTopBtn"),
        helpBtn: document.getElementById("helpBtn"),
        closeHelpBtn: document.getElementById("closeHelpBtn"),
        nextGameBtn: document.getElementById("nextGameBtn"),
        newBtn: document.getElementById("newBtn"),
        clearBtn: document.getElementById("clearBtn"),
        hintBtn: document.getElementById("hintBtn"),
        undoBtn: document.getElementById("undoBtn"),
        answerBtn: document.getElementById("answerBtn")
      };

      let cellEls = [];
      let clueByIndex = new Map();
      let solutionRects = [];
      let regions = new Map();
      let owners = Array(TOTAL).fill(null);
      let nextRegionId = 1;
      let activePalette = [];
      let puzzleNo = 0;
      let draft = null;
      let gesture = null;
      let moveFrame = 0;
      let timerId = 0;
      let startAt = 0;
      let elapsedSeconds = 0;
      let gameWon = false;
      let answerArmed = false;
      let undoStack = [];
      let toastTimer = 0;

      function init() {
        buildGrid();
        setDateLine();
        bindEvents();
        updateBestText();
        newGame();

        try {
          if (!localStorage.getItem(HELP_KEY)) {
            setTimeout(() => showHelp(), 420);
            localStorage.setItem(HELP_KEY, "1");
          }
        } catch (_) {}
      }

      function buildGrid() {
        els.grid.innerHTML = "";
        cellEls = [];

        for (let i = 0; i < TOTAL; i += 1) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.index = String(i);
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("aria-rowindex", String(rowOf(i) + 1));
          cell.setAttribute("aria-colindex", String(colOf(i) + 1));

          const num = document.createElement("span");
          num.className = "num";
          cell.appendChild(num);

          els.grid.appendChild(cell);
          cellEls.push(cell);
        }
      }

      function setDateLine() {
        const date = new Date();
        try {
          const weekday = new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(date);
          const day = new Intl.DateTimeFormat("en-US", { day: "numeric" }).format(date);
          const month = new Intl.DateTimeFormat("en-US", { month: "long" }).format(date);
          els.dateLine.textContent = `${weekday}, ${day} ${month}`;
        } catch (_) {
          els.dateLine.textContent = "Shikaku 7×7";
        }
      }

      function bindEvents() {
        els.board.addEventListener("pointerdown", onPointerDown);
        els.board.addEventListener("pointermove", onPointerMove);
        els.board.addEventListener("pointerup", onPointerUp);
        els.board.addEventListener("pointercancel", onPointerCancel);
        els.board.addEventListener("lostpointercapture", onPointerCancel);

        els.newTopBtn.addEventListener("click", newGame);
        els.newBtn.addEventListener("click", newGame);
        els.clearBtn.addEventListener("click", clearBoard);
        els.hintBtn.addEventListener("click", giveHint);
        els.undoBtn.addEventListener("click", undo);
        els.answerBtn.addEventListener("click", onAnswerClick);
        els.helpBtn.addEventListener("click", showHelp);
        els.closeHelpBtn.addEventListener("click", hideHelp);
        els.nextGameBtn.addEventListener("click", () => {
          hideWin();
          newGame();
        });

        window.addEventListener("resize", () => requestAnimationFrame(renderBlocks));
        if ("ResizeObserver" in window) {
          const resizeObserver = new ResizeObserver(() => renderBlocks());
          resizeObserver.observe(els.board);
        }

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            hideHelp();
            hideWin();
            if (gesture) cancelGesture(true);
          }
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
            event.preventDefault();
            undo();
          }
        });
      }

      function newGame() {
        answerArmed = false;
        els.answerBtn.classList.remove("answer-armed");
        hideWin();
        resetTimer();
        puzzleNo = Math.floor(10000 + Math.random() * 90000);
        activePalette = shuffle([...palette]);
        solutionRects = generatePuzzleRects();
        clueByIndex = makeClues(solutionRects);
        regions = new Map();
        owners = Array(TOTAL).fill(null);
        nextRegionId = 1;
        undoStack = [];
        draft = null;
        gesture = null;
        gameWon = false;
        els.puzzleChip.innerHTML = `<span class="status-dot"></span><span>#${puzzleNo}</span>`;
        setStatus("拖出一個矩形；裡面只能有一個數字，格數要等於它。");
        updateUndoButton();
        render();
        startTimer();
      }

      function generatePuzzleRects() {
        const targetCount = 8 + Math.floor(Math.random() * 4); // 8 - 11 regions
        let rects = [{ r: 0, c: 0, h: SIZE, w: SIZE }];
        let guard = 0;

        while (guard < 120) {
          guard += 1;
          const oversized = rects
            .map((rect, index) => ({ rect, index, area: areaOfRect(rect) }))
            .filter(item => item.area > DEFAULT_MAX_AREA)
            .sort((a, b) => b.area - a.area);

          if (oversized.length === 0) break;
          const picked = oversized[0];
          const split = pickSplit(picked.rect);
          if (!split) break;
          rects.splice(picked.index, 1, split[0], split[1]);
        }

        guard = 0;
        while (rects.length < targetCount && guard < 90) {
          guard += 1;
          const candidates = rects
            .map((rect, index) => ({ rect, index, area: areaOfRect(rect), options: splitOptions(rect) }))
            .filter(item => item.options.length > 0 && item.area >= 6)
            .sort((a, b) => b.area - a.area);

          if (!candidates.length) break;
          const picked = weightedPick(candidates, item => Math.max(1, item.area));
          const split = pickSplit(picked.rect);
          if (!split) break;
          rects.splice(picked.index, 1, split[0], split[1]);
        }

        return rects.map((rect, index) => ({
          ...rect,
          id: index + 1,
          area: areaOfRect(rect),
          cells: rectCells(rect)
        }));
      }

      function splitOptions(rect) {
        const options = [];

        for (let cut = 1; cut < rect.h; cut += 1) {
          const a = cut * rect.w;
          const b = (rect.h - cut) * rect.w;
          if (a >= MIN_AREA && b >= MIN_AREA) {
            options.push([
              { r: rect.r, c: rect.c, h: cut, w: rect.w },
              { r: rect.r + cut, c: rect.c, h: rect.h - cut, w: rect.w }
            ]);
          }
        }

        for (let cut = 1; cut < rect.w; cut += 1) {
          const a = cut * rect.h;
          const b = (rect.w - cut) * rect.h;
          if (a >= MIN_AREA && b >= MIN_AREA) {
            options.push([
              { r: rect.r, c: rect.c, h: rect.h, w: cut },
              { r: rect.r, c: rect.c + cut, h: rect.h, w: rect.w - cut }
            ]);
          }
        }

        return options;
      }

      function pickSplit(rect) {
        const options = splitOptions(rect);
        if (!options.length) return null;
        return weightedPick(options, pair => {
          const a = areaOfRect(pair[0]);
          const b = areaOfRect(pair[1]);
          const balance = 1 / (1 + Math.abs(a - b));
          const shape = shapeScore(pair[0]) + shapeScore(pair[1]);
          return balance * 8 + shape;
        });
      }

      function shapeScore(rect) {
        const shortSide = Math.min(rect.h, rect.w);
        const longSide = Math.max(rect.h, rect.w);
        return shortSide / longSide;
      }

      function makeClues(rects) {
        const clues = new Map();
        for (const rect of rects) {
          const cells = rect.cells;
          const clueIndex = cells[Math.floor(Math.random() * cells.length)];
          rect.clueIndex = clueIndex;
          clues.set(clueIndex, rect.area);
        }
        return clues;
      }

      function render() {
        const draftSet = draft ? new Set(draft.cells) : new Set();
        for (let i = 0; i < TOTAL; i += 1) {
          const cell = cellEls[i];
          const num = cell.firstElementChild;
          const clue = clueByIndex.get(i);
          const ownerId = owners[i];
          const isOwned = ownerId !== null && ownerId !== undefined;
          const isDraft = draftSet.has(i);
          const classes = ["cell"];

          if (clue) classes.push("clue");
          if (isOwned) classes.push("filled");
          if (isDraft) classes.push("draft");
          cell.className = classes.join(" ");
          num.textContent = clue ? String(clue) : "";

          if (isDraft && draft) {
            cell.style.color = draft.valid ? textColorFor(draft.color) : "#ffffff";
          } else if (isOwned) {
            const region = regions.get(ownerId);
            cell.style.color = region ? textColorFor(region.color) : "";
          } else {
            cell.style.color = "";
          }
        }

        renderBlocks();
        renderBadge();
        updateProgress();
      }

      function renderBlocks() {
        els.blocks.innerHTML = "";

        for (const region of regions.values()) {
          addBlock(region, region.color, "");
        }

        if (draft) {
          addBlock(draft, draft.valid ? draft.color : "#c8434f", draft.valid ? "draft" : "draft invalid");
        }
      }

      function addBlock(shape, color, extraClass) {
        if (!shape || !shape.cells || !shape.cells.length) return;
        const rect = boundsOfCells(shape.cells);
        const first = cellEls[indexOf(rect.r, rect.c)];
        const last = cellEls[indexOf(rect.r + rect.h - 1, rect.c + rect.w - 1)];
        if (!first || !last) return;

        const block = document.createElement("div");
        block.className = `block ${extraClass || ""}`.trim();
        block.style.background = color;
        block.style.left = `${first.offsetLeft}px`;
        block.style.top = `${first.offsetTop}px`;
        block.style.width = `${last.offsetLeft + last.offsetWidth - first.offsetLeft}px`;
        block.style.height = `${last.offsetTop + last.offsetHeight - first.offsetTop}px`;
        els.blocks.appendChild(block);
      }

      function renderBadge() {
        if (!draft) {
          els.selectionBadge.hidden = true;
          return;
        }

        const currentIndex = draft.currentIndex ?? draft.cells[draft.cells.length - 1];
        const cell = cellEls[currentIndex];
        if (!cell) {
          els.selectionBadge.hidden = true;
          return;
        }

        const area = draft.cells.length;
        const targetText = draft.target ? ` / ${draft.target}` : "";
        els.selectionBadge.textContent = `${area}${targetText}`;
        els.selectionBadge.className = `selection-badge ${draft.valid ? "good" : "bad"}`;
        els.selectionBadge.hidden = false;
        els.selectionBadge.style.left = `${cell.offsetLeft + cell.offsetWidth / 2}px`;
        els.selectionBadge.style.top = `${cell.offsetTop + 4}px`;
      }

      function onPointerDown(event) {
        if (gameWon) return;
        const index = cellIndexFromPoint(event.clientX, event.clientY);
        if (index === null) return;

        event.preventDefault();
        answerArmed = false;
        els.answerBtn.classList.remove("answer-armed");

        try { els.board.setPointerCapture(event.pointerId); } catch (_) {}

        const beforeSnapshot = makeSnapshot();
        const backup = owners[index] != null ? removeRegion(owners[index]) : null;
        gesture = {
          pointerId: event.pointerId,
          startIndex: index,
          currentIndex: index,
          startX: event.clientX,
          startY: event.clientY,
          moved: false,
          backup,
          beforeSnapshot,
          color: backup ? backup.color : colorForNextRegion()
        };

        updateDraft(index);
      }

      function onPointerMove(event) {
        if (!gesture || event.pointerId !== gesture.pointerId) return;
        event.preventDefault();

        const index = cellIndexFromPoint(event.clientX, event.clientY);
        const dx = Math.abs(event.clientX - gesture.startX);
        const dy = Math.abs(event.clientY - gesture.startY);
        if (dx + dy > 7) gesture.moved = true;
        if (index === null || index === gesture.currentIndex) return;

        gesture.currentIndex = index;
        gesture.moved = true;
        if (!moveFrame) {
          moveFrame = requestAnimationFrame(() => {
            moveFrame = 0;
            if (gesture) updateDraft(gesture.currentIndex);
          });
        }
      }

      function onPointerUp(event) {
        if (!gesture || event.pointerId !== gesture.pointerId) return;
        event.preventDefault();
        finishGesture();
      }

      function onPointerCancel(event) {
        if (!gesture) return;
        if (event && event.pointerId !== undefined && event.pointerId !== gesture.pointerId) return;
        cancelGesture(true);
      }

      function updateDraft(currentIndex) {
        if (!gesture) return;
        const rect = rectBetween(gesture.startIndex, currentIndex);
        const validation = validateCells(rect.cells);
        draft = {
          ...rect,
          currentIndex,
          color: gesture.color,
          valid: validation.ok,
          target: validation.target,
          clueIndex: validation.clueIndex,
          message: validation.message
        };

        if (validation.ok) {
          setStatus(`可放置：選取 ${rect.cells.length} 格，剛好等於 ${validation.target}。`);
        } else {
          setStatus(validation.message);
        }

        render();
      }

      function finishGesture() {
        const currentGesture = gesture;
        const currentDraft = draft;

        gesture = null;
        draft = null;
        if (moveFrame) {
          cancelAnimationFrame(moveFrame);
          moveFrame = 0;
        }

        if (!currentGesture || !currentDraft) {
          render();
          return;
        }

        if (!currentGesture.moved && currentGesture.backup) {
          pushUndoSnapshot(currentGesture.beforeSnapshot);
          setStatus("已清除一塊；重新拖曳即可再上色。");
          showToast("已清除區塊");
          haptic(8);
          render();
          return;
        }

        if (currentDraft.valid) {
          pushUndoSnapshot(currentGesture.beforeSnapshot);
          commitRegion(currentDraft, currentGesture.color);
          haptic(12);
          setStatus("放置成功。繼續把所有灰格上色。");
          render();
          checkWin();
          return;
        }

        if (currentGesture.backup) restoreRegion(currentGesture.backup);
        render();
        setStatus(currentDraft.message || "這塊不符合數字要求。");
        showToast(currentDraft.message || "這塊不符合數字要求");
        shakeBoard();
        haptic([20, 30, 20]);
      }

      function cancelGesture(restoreBackup) {
        const backup = gesture && gesture.backup;
        gesture = null;
        draft = null;
        if (moveFrame) {
          cancelAnimationFrame(moveFrame);
          moveFrame = 0;
        }
        if (restoreBackup && backup) restoreRegion(backup);
        setStatus("拖出一個矩形；裡面只能有一個數字，格數要等於它。");
        render();
      }

      function validateCells(cells) {
        const clueCells = cells.filter(index => clueByIndex.has(index));
        const area = cells.length;
        const blocked = cells.find(index => owners[index] != null);

        if (blocked !== undefined) {
          return { ok: false, message: "不能覆蓋已經上色的區塊。" };
        }

        if (clueCells.length === 0) {
          return { ok: false, message: `選取 ${area} 格；矩形內需要包含一個數字。` };
        }

        if (clueCells.length > 1) {
          return { ok: false, message: `選取 ${area} 格；矩形內只能有一個數字。`, clueIndex: clueCells[0], target: clueByIndex.get(clueCells[0]) };
        }

        const clueIndex = clueCells[0];
        const target = clueByIndex.get(clueIndex);
        if (area !== target) {
          return { ok: false, message: `選取 ${area} 格；目標是 ${target} 格。`, clueIndex, target };
        }

        return { ok: true, message: "可以放置。", clueIndex, target };
      }

      function commitRegion(shape, color) {
        const id = nextRegionId;
        nextRegionId += 1;
        const region = {
          id,
          cells: [...shape.cells],
          clueIndex: shape.clueIndex,
          value: shape.target,
          color
        };
        regions.set(id, region);
        for (const index of region.cells) owners[index] = id;
      }

      function removeRegion(id) {
        const region = regions.get(id);
        if (!region) return null;
        const backup = {
          id: region.id,
          cells: [...region.cells],
          clueIndex: region.clueIndex,
          value: region.value,
          color: region.color
        };
        for (const index of region.cells) owners[index] = null;
        regions.delete(id);
        return backup;
      }

      function restoreRegion(region) {
        if (!region) return;
        regions.set(region.id, {
          id: region.id,
          cells: [...region.cells],
          clueIndex: region.clueIndex,
          value: region.value,
          color: region.color
        });
        for (const index of region.cells) owners[index] = region.id;
        nextRegionId = Math.max(nextRegionId, region.id + 1);
      }

      function clearBoard() {
        if (!regions.size) {
          showToast("目前還沒有上色區塊");
          return;
        }
        pushUndo();
        regions = new Map();
        owners = Array(TOTAL).fill(null);
        draft = null;
        gesture = null;
        gameWon = false;
        setStatus("已清空。重新拖曳區塊即可開始。");
        render();
      }

      function giveHint() {
        if (gameWon) return;
        const candidates = solutionRects.filter(rect => rect.cells.every(index => owners[index] == null));
        if (!candidates.length) {
          showToast("先點一下可疑區塊清除，再使用提示");
          setStatus("目前沒有可直接放入的提示區塊；先清除重疊區塊。");
          return;
        }

        const rect = weightedPick(candidates, item => Math.max(1, item.area));
        pushUndo();
        const color = colorForNextRegion();
        const id = nextRegionId;
        nextRegionId += 1;
        regions.set(id, {
          id,
          cells: [...rect.cells],
          clueIndex: rect.clueIndex,
          value: rect.area,
          color
        });
        for (const index of rect.cells) owners[index] = id;
        setStatus(`提示已放入 ${rect.area} 格區塊。`);
        showToast("提示已放入一塊");
        haptic(10);
        render();
        checkWin();
      }

      function onAnswerClick() {
        if (gameWon) return;
        if (!answerArmed) {
          answerArmed = true;
          els.answerBtn.classList.add("answer-armed");
          showToast("再按一次「答案」會顯示完整解答");
          setTimeout(() => {
            answerArmed = false;
            els.answerBtn.classList.remove("answer-armed");
          }, 2400);
          return;
        }
        answerArmed = false;
        els.answerBtn.classList.remove("answer-armed");
        revealAnswer();
      }

      function revealAnswer() {
        pushUndo();
        regions = new Map();
        owners = Array(TOTAL).fill(null);
        nextRegionId = 1;
        activePalette = shuffle([...palette]);

        for (const rect of solutionRects) {
          const id = nextRegionId;
          nextRegionId += 1;
          const color = colorForNextRegion(id - 1);
          regions.set(id, {
            id,
            cells: [...rect.cells],
            clueIndex: rect.clueIndex,
            value: rect.area,
            color
          });
          for (const index of rect.cells) owners[index] = id;
        }

        stopTimer();
        gameWon = true;
        setStatus("已顯示答案。本局不記錄最佳時間。");
        showToast("已顯示完整答案");
        render();
      }

      function makeSnapshot() {
        return {
          owners: [...owners],
          nextRegionId,
          regions: [...regions.values()].map(region => ({
            id: region.id,
            cells: [...region.cells],
            clueIndex: region.clueIndex,
            value: region.value,
            color: region.color
          })),
          gameWon
        };
      }

      function pushUndoSnapshot(snapshot) {
        if (!snapshot) return;
        undoStack.push(snapshot);
        if (undoStack.length > 40) undoStack.shift();
        updateUndoButton();
      }

      function pushUndo() {
        pushUndoSnapshot(makeSnapshot());
      }

      function undo() {
        if (!undoStack.length) return;
        const snapshot = undoStack.pop();
        owners = [...snapshot.owners];
        nextRegionId = snapshot.nextRegionId;
        regions = new Map(snapshot.regions.map(region => [region.id, {
          id: region.id,
          cells: [...region.cells],
          clueIndex: region.clueIndex,
          value: region.value,
          color: region.color
        }]));
        gameWon = false;
        hideWin();
        if (!timerId) startTimer(true);
        setStatus("已回復上一步。");
        updateUndoButton();
        render();
      }

      function updateUndoButton() {
        els.undoBtn.disabled = undoStack.length === 0;
      }

      function checkWin() {
        if (owners.some(owner => owner == null)) return false;
        for (const region of regions.values()) {
          const validation = validateCommittedRegion(region);
          if (!validation) return false;
        }

        gameWon = true;
        stopTimer();
        const best = saveBest(elapsedSeconds);
        updateBestText();
        els.winTime.textContent = formatTime(elapsedSeconds);
        els.winBest.textContent = best ? formatTime(best) : "—";
        setStatus("完成！整個數讀盤都正確上色。");
        showWin();
        haptic([12, 24, 12]);
        return true;
      }

      function validateCommittedRegion(region) {
        const clueCells = region.cells.filter(index => clueByIndex.has(index));
        if (clueCells.length !== 1) return false;
        return region.cells.length === clueByIndex.get(clueCells[0]);
      }

      function updateProgress() {
        const filled = owners.filter(owner => owner != null).length;
        const percent = Math.round((filled / TOTAL) * 100);
        els.progressFill.style.width = `${percent}%`;
        els.filledText.textContent = `已上色 ${filled} / ${TOTAL}`;
      }

      function resetTimer() {
        stopTimer();
        elapsedSeconds = 0;
        startAt = performance.now();
        els.timer.textContent = "00:00";
      }

      function startTimer(continueFromElapsed = false) {
        stopTimer();
        const offset = continueFromElapsed ? elapsedSeconds * 1000 : 0;
        startAt = performance.now() - offset;
        timerId = window.setInterval(updateTimer, 250);
        updateTimer();
      }

      function stopTimer() {
        if (timerId) {
          elapsedSeconds = Math.max(0, Math.floor((performance.now() - startAt) / 1000));
          window.clearInterval(timerId);
          timerId = 0;
        }
        els.timer.textContent = formatTime(elapsedSeconds);
      }

      function updateTimer() {
        if (timerId) {
          elapsedSeconds = Math.max(0, Math.floor((performance.now() - startAt) / 1000));
        }
        els.timer.textContent = formatTime(elapsedSeconds);
      }

      function formatTime(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const two = value => String(value).padStart(2, "0");
        return hours > 0 ? `${hours}:${two(minutes)}:${two(seconds)}` : `${two(minutes)}:${two(seconds)}`;
      }

      function getBest() {
        try {
          const raw = Number(localStorage.getItem(BEST_KEY));
          return Number.isFinite(raw) && raw > 0 ? raw : null;
        } catch (_) {
          return null;
        }
      }

      function saveBest(seconds) {
        const current = getBest();
        if (!current || seconds < current) {
          try { localStorage.setItem(BEST_KEY, String(seconds)); } catch (_) {}
          return seconds;
        }
        return current;
      }

      function updateBestText() {
        const best = getBest();
        els.bestText.textContent = `最佳：${best ? formatTime(best) : "—"}`;
      }

      function colorForNextRegion(index = regions.size) {
        if (!activePalette.length) activePalette = shuffle([...palette]);
        return activePalette[index % activePalette.length];
      }

      function textColorFor(hex) {
        const rgb = parseHex(hex);
        if (!rgb) return "#121923";
        const [r, g, b] = rgb.map(value => {
          const srgb = value / 255;
          return srgb <= 0.03928 ? srgb / 12.92 : Math.pow((srgb + 0.055) / 1.055, 2.4);
        });
        const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        return luminance > 0.42 ? "#1c1a17" : "#ffffff";
      }

      function parseHex(hex) {
        const value = String(hex).replace("#", "").trim();
        if (value.length !== 6) return null;
        const int = Number.parseInt(value, 16);
        if (!Number.isFinite(int)) return null;
        return [(int >> 16) & 255, (int >> 8) & 255, int & 255];
      }

      function rectBetween(a, b) {
        const r1 = rowOf(a);
        const c1 = colOf(a);
        const r2 = rowOf(b);
        const c2 = colOf(b);
        const r = Math.min(r1, r2);
        const c = Math.min(c1, c2);
        const h = Math.abs(r1 - r2) + 1;
        const w = Math.abs(c1 - c2) + 1;
        const cells = [];
        for (let rr = r; rr < r + h; rr += 1) {
          for (let cc = c; cc < c + w; cc += 1) {
            cells.push(indexOf(rr, cc));
          }
        }
        return { r, c, h, w, cells };
      }

      function rectCells(rect) {
        const cells = [];
        for (let r = rect.r; r < rect.r + rect.h; r += 1) {
          for (let c = rect.c; c < rect.c + rect.w; c += 1) {
            cells.push(indexOf(r, c));
          }
        }
        return cells;
      }

      function boundsOfCells(cells) {
        let minR = SIZE;
        let minC = SIZE;
        let maxR = 0;
        let maxC = 0;
        for (const index of cells) {
          const r = rowOf(index);
          const c = colOf(index);
          minR = Math.min(minR, r);
          minC = Math.min(minC, c);
          maxR = Math.max(maxR, r);
          maxC = Math.max(maxC, c);
        }
        return { r: minR, c: minC, h: maxR - minR + 1, w: maxC - minC + 1 };
      }

      function cellIndexFromPoint(clientX, clientY) {
        if (!cellEls.length) return null;
        const first = cellEls[0].getBoundingClientRect();
        const second = cellEls[1].getBoundingClientRect();
        const below = cellEls[SIZE].getBoundingClientRect();
        const last = cellEls[TOTAL - 1].getBoundingClientRect();
        const stepX = second.left - first.left;
        const stepY = below.top - first.top;
        const gapX = Math.max(0, stepX - first.width);
        const gapY = Math.max(0, stepY - first.height);

        if (
          clientX < first.left - gapX / 2 ||
          clientY < first.top - gapY / 2 ||
          clientX > last.right + gapX / 2 ||
          clientY > last.bottom + gapY / 2
        ) return null;

        const col = Math.floor((clientX - first.left + gapX / 2) / stepX);
        const row = Math.floor((clientY - first.top + gapY / 2) / stepY);
        if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return null;
        return indexOf(row, col);
      }

      function areaOfRect(rect) {
        return rect.h * rect.w;
      }

      function rowOf(index) {
        return Math.floor(index / SIZE);
      }

      function colOf(index) {
        return index % SIZE;
      }

      function indexOf(row, col) {
        return row * SIZE + col;
      }

      function weightedPick(items, weightFn) {
        const weights = items.map(item => Math.max(0.0001, Number(weightFn(item)) || 0.0001));
        const total = weights.reduce((sum, weight) => sum + weight, 0);
        let cursor = Math.random() * total;
        for (let i = 0; i < items.length; i += 1) {
          cursor -= weights[i];
          if (cursor <= 0) return items[i];
        }
        return items[items.length - 1];
      }

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function setStatus(text) {
        els.statusText.textContent = text;
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add("show");
        toastTimer = window.setTimeout(() => els.toast.classList.remove("show"), 1600);
      }

      function shakeBoard() {
        els.board.classList.remove("shake");
        void els.board.offsetWidth;
        els.board.classList.add("shake");
      }

      function haptic(pattern) {
        try {
          if (navigator.vibrate) navigator.vibrate(pattern);
        } catch (_) {}
      }

      function showHelp() {
        els.helpSheet.hidden = false;
      }

      function hideHelp() {
        els.helpSheet.hidden = true;
      }

      function showWin() {
        els.winSheet.hidden = false;
      }

      function hideWin() {
        els.winSheet.hidden = true;
      }

      init();
    })();
  </script>
</body>
</html>
